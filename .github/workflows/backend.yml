name: Backend to Private EC2

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==========================================
      # 3. Configure AWS Credentials
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ==========================================
      # 4. Check SSM
      # ==========================================
      - name: Check EC2 SSM Connection
        run: |
          echo "Checking SSM managed instances..."

          aws ssm describe-instance-information \
            --region eu-north-1

          echo "Checking selected EC2 instance..."

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1


      # ==========================================
      # 5. Deploy Backend using SSM
      # ==========================================
      - name: Deploy Backend using SSM
        shell: bash
        run: |

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend" \
            --parameters 'commands=[
              "set -e",

              "echo ==============================",
              "echo Starting Backend Deployment",
              "echo ==============================",

              "echo Checking application directory",
              "cd /home/ec2-user/app/Java-springboot-project",

              "echo Updating repository",
              "git reset --hard",
              "git clean -fd",
              "git pull origin main",

              "echo Moving to backend directory",
              "cd backend",

              "echo Building Spring Boot application",
              "mvn clean package -DskipTests -U",

              "echo ==============================",
              "echo Stopping old application",
              "echo ==============================",

              "sudo systemctl stop datastore.service || true",

              "sleep 5",

              "echo ==============================",
              "echo Starting new application",
              "echo ==============================",

              "sudo systemctl start datastore.service",

              "echo Waiting for application startup",
              "sleep 15",

              "echo ==============================",
              "echo Checking systemd status",
              "echo ==============================",

              "sudo systemctl status datastore.service --no-pager",

              "echo ==============================",
              "echo Checking application health",
              "echo ==============================",

              "HEALTH=$(curl -sf http://localhost:8084/actuator/health)",
              "echo \"$HEALTH\"",

              "echo \"$HEALTH\" | grep -q '\''\"status\":\"UP\"'\''",

              "echo ==============================",
              "echo Deployment successful!",
              "echo =============================="
            ]' \
            --timeout-seconds 600 \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1

          echo "Getting deployment output..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1 \
            --query "StandardOutputContent" \
            --output text

          echo "Getting deployment errors..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1 \
            --query "StandardErrorContent" \
            --output text


      # ==========================================
      # 6. Final Health Check
      # ==========================================
      - name: Verify Backend
        shell: bash
        run: |

          echo "Running final health check through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Spring Boot Backend" \
            --parameters 'commands=[
              "echo Checking datastore service",
              "sudo systemctl is-active datastore.service",

              "echo Checking port 8084",
              "sudo ss -lntp | grep :8084",

              "echo Checking Spring Boot health endpoint",
              "curl -sf http://localhost:8084/actuator/health",

              "echo Backend verification successful"
            ]' \
            --timeout-seconds 120 \
            --region eu-north-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Health Check Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1

          echo "Health check output:"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region eu-north-1 \
            --query "StandardOutputContent" \
            --output text

          echo "Backend deployment completed successfully."
