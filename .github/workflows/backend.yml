
name: Backend to Private EC2

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==========================================
      # 3. Configure AWS Credentials
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ==========================================
      # 4. Verify AWS Identity
      # ==========================================
      - name: Verify AWS Credentials
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo "EC2 Instance:"
          echo "$EC2_INSTANCE_ID"


      # ==========================================
      # 5. Check EC2 Instance
      # ==========================================
      - name: Check EC2 Instance
        run: |

          echo "Checking EC2 instance..."

          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name,PrivateIpAddress]' \
            --output table


      # ==========================================
      # 6. Check SSM Connection
      # ==========================================
      - name: Check SSM Connection
        run: |

          echo "Checking SSM managed instance..."

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[*].[InstanceId,PingStatus,AgentVersion,PlatformName]' \
            --output table


      # ==========================================
      # 7. Deploy Backend Through SSM
      # ==========================================
      - name: Deploy Backend using SSM
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Sending deployment command to private EC2"
          echo "=========================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -e",

              "echo ==========================================",
              "echo Starting Backend Deployment",
              "echo ==========================================",

              "echo Checking current user",
              "whoami",

              "echo Checking Java",
              "java -version",

              "echo Checking Maven",
              "mvn -version",

              "echo Checking application directory",
              "cd /home/ec2-user/app/Java-springboot-project",

              "echo Current directory:",
              "pwd",

              "echo ==========================================",
              "echo Updating Git Repository",
              "echo ==========================================",

              "git reset --hard",
              "git clean -fd",
              "git pull origin main",

              "echo ==========================================",
              "echo Building Backend",
              "echo ==========================================",

              "cd backend",
              "mvn clean package -DskipTests -U",

              "echo ==========================================",
              "echo Checking generated JAR",
              "echo ==========================================",

              "ls -lh target/",
              "test -f target/datastore-0.0.7.jar",

              "echo ==========================================",
              "echo Stopping Existing Application",
              "echo ==========================================",

              "sudo systemctl stop datastore.service || true",

              "sleep 5",

              "echo ==========================================",
              "echo Checking Old Application",
              "echo ==========================================",

              "sudo systemctl status datastore.service --no-pager || true",

              "echo ==========================================",
              "echo Starting New Application",
              "echo ==========================================",

              "sudo systemctl start datastore.service",

              "echo ==========================================",
              "echo Waiting for Application",
              "echo ==========================================",

              "sleep 15",

              "echo ==========================================",
              "echo Systemd Status",
              "echo ==========================================",

              "sudo systemctl status datastore.service --no-pager",

              "echo ==========================================",
              "echo Checking Port 8084",
              "echo ==========================================",

              "sudo ss -lntp | grep :8084",

              "echo ==========================================",
              "echo Checking Spring Boot Health",
              "echo ==========================================",

              "curl -sf http://localhost:8084/actuator/health",

              "echo",
              "echo ==========================================",
              "echo Deployment Successful",
              "echo =========================================="
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM deployment..."

          # Do not use the AWS waiter directly because we want
          # to print stdout/stderr even when the remote command fails.

          while true
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Current SSM status: $STATUS"

            case "$STATUS" in

              Pending|InProgress)
                sleep 5
                ;;

              Success)
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo ""
                echo "=========================================="
                echo "SSM COMMAND FAILED"
                echo "=========================================="

                echo ""
                echo "STANDARD OUTPUT:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo ""
                echo "STANDARD ERROR:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true

                echo ""
                echo "STATUS DETAILS:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StatusDetails" \
                  --output text || true

                echo ""
                echo "RESPONSE CODE:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "ResponseCode" \
                  --output text || true

                exit 1
                ;;

              *)
                echo "Unexpected status: $STATUS"
                sleep 5
                ;;

            esac

          done


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT ERRORS"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" \
            --output text || true


      # ==========================================
      # 8. Final Verification Through SSM
      # ==========================================
      - name: Verify Backend
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Running Final Backend Verification"
          echo "=========================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Spring Boot Backend" \
            --timeout-seconds 120 \
            --parameters 'commands=[
              "echo Checking datastore service",
              "sudo systemctl is-active --quiet datastore.service",

              "echo Checking port 8084",
              "sudo ss -lntp | grep :8084",

              "echo Checking Spring Boot health",
              "curl -sf http://localhost:8084/actuator/health",

              "echo Backend verification successful"
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Verification Command ID: $COMMAND_ID"


          while true
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Verification status: $STATUS"

            case "$STATUS" in

              Pending|InProgress)
                sleep 5
                ;;

              Success)
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo ""
                echo "=========================================="
                echo "VERIFICATION FAILED"
                echo "=========================================="

                echo ""
                echo "OUTPUT:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo ""
                echo "ERROR:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done


          echo ""
          echo "=========================================="
          echo "FINAL VERIFICATION OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text


          echo ""
          echo "=========================================="
          echo "BACKEND DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

