
name: Backend to Private EC2

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==========================================
      # 3. Configure AWS Credentials
      # ==========================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ==========================================
      # 4. Verify AWS Credentials
      # ==========================================
      - name: Verify AWS Credentials
        run: |

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS REGION:"
          echo "$AWS_REGION"

          echo ""
          echo "EC2 INSTANCE:"
          echo "$EC2_INSTANCE_ID"


      # ==========================================
      # 5. Check EC2 Instance
      # ==========================================
      - name: Check EC2 Instance
        run: |

          echo "=========================================="
          echo "CHECKING EC2 INSTANCE"
          echo "=========================================="

          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name,PrivateIpAddress]' \
            --output table


      # ==========================================
      # 6. Check SSM Connection
      # ==========================================
      - name: Check SSM Connection
        run: |

          echo "=========================================="
          echo "CHECKING SSM CONNECTION"
          echo "=========================================="

          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[*].[InstanceId,PingStatus,AgentVersion,PlatformName]' \
            --output table


      # ==========================================
      # 7. Deploy Backend Through SSM
      # ==========================================
      - name: Deploy Backend using SSM
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "STARTING BACKEND DEPLOYMENT"
          echo "=========================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend" \
            --timeout-seconds 600 \
            --parameters 'commands=[
              "set -e",

              "echo ==========================================",
              "echo Checking Current User",
              "echo ==========================================",
              "whoami",

              "echo ==========================================",
              "echo Checking Java",
              "echo ==========================================",
              "java -version",

              "echo ==========================================",
              "echo Checking Maven",
              "echo ==========================================",
              "mvn -version",

              "echo ==========================================",
              "echo Checking Application Directory",
              "echo ==========================================",

              "test -d /home/ec2-user/Java-springboot-project",

              "cd /home/ec2-user/Java-springboot-project",

              "echo Current directory:",
              "pwd",

              "echo ==========================================",
              "echo Checking Git Repository",
              "echo ==========================================",

              "git status",

              "echo ==========================================",
              "echo Updating Repository",
              "echo ==========================================",

              "git reset --hard",
              "git clean -fd",
              "git pull origin main",

              "echo ==========================================",
              "echo Moving To Backend",
              "echo ==========================================",

              "cd backend",

              "pwd",

              "echo ==========================================",
              "echo Building Spring Boot Application",
              "echo ==========================================",

              "mvn clean package -DskipTests -U",

              "echo ==========================================",
              "echo Checking Generated JAR",
              "echo ==========================================",

              "ls -lh target/",

              "test -f target/datastore-0.0.7.jar",

              "echo JAR file found successfully",

              "echo ==========================================",
              "echo Stopping Old Application",
              "echo ==========================================",

              "sudo systemctl stop datastore.service || true",

              "sleep 5",

              "echo ==========================================",
              "echo Checking Application Status",
              "echo ==========================================",

              "sudo systemctl status datastore.service --no-pager || true",

              "echo ==========================================",
              "echo Starting New Application",
              "echo ==========================================",

              "sudo systemctl start datastore.service",

              "echo ==========================================",
              "echo Waiting For Application Startup",
              "echo ==========================================",

              "sleep 15",

              "echo ==========================================",
              "echo Checking Systemd Service",
              "echo ==========================================",

              "sudo systemctl status datastore.service --no-pager",

              "echo ==========================================",
              "echo Checking Port 8084",
              "echo ==========================================",

              "sudo ss -lntp | grep :8084",

              "echo ==========================================",
              "echo Checking Application Health",
              "echo ==========================================",

              "curl -sf http://localhost:8084/actuator/health",

              "echo",

              "echo ==========================================",
              "echo Checking Health Status",
              "echo ==========================================",

              "curl -sf http://localhost:8084/actuator/health | grep -q '\''\"status\":\"UP\"'\''",

              "echo",

              "echo ==========================================",
              "echo BACKEND DEPLOYMENT SUCCESSFUL",
              "echo =========================================="
            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo ""
          echo "SSM COMMAND ID:"
          echo "$COMMAND_ID"

          echo ""
          echo "=========================================="
          echo "WAITING FOR SSM COMMAND"
          echo "=========================================="

          while true
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Current status: $STATUS"

            case "$STATUS" in

              Pending|InProgress)
                sleep 5
                ;;

              Success)
                echo "SSM command completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo ""
                echo "=========================================="
                echo "SSM COMMAND FAILED"
                echo "=========================================="

                echo ""
                echo "STATUS:"
                echo "$STATUS"

                echo ""
                echo "=========================================="
                echo "STANDARD OUTPUT"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo ""
                echo "=========================================="
                echo "STANDARD ERROR"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true

                echo ""
                echo "=========================================="
                echo "RESPONSE CODE"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "ResponseCode" \
                  --output text || true

                echo ""
                echo "=========================================="
                echo "STATUS DETAILS"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StatusDetails" \
                  --output text || true

                exit 1
                ;;

              *)
                echo "Unknown status: $STATUS"
                sleep 5
                ;;

            esac

          done


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text


          echo ""
          echo "=========================================="
          echo "DEPLOYMENT STDERR"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardErrorContent" \
            --output text || true


      # ==========================================
      # 8. Final Backend Verification
      # ==========================================
      - name: Verify Backend
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "FINAL BACKEND VERIFICATION"
          echo "=========================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Spring Boot Backend" \
            --timeout-seconds 120 \
            --parameters 'commands=[

              "echo ==========================================",
              "echo Checking Datastore Service",
              "echo ==========================================",

              "sudo systemctl is-active --quiet datastore.service",

              "echo Datastore service is ACTIVE",

              "echo ==========================================",
              "echo Checking Port 8084",
              "echo ==========================================",

              "sudo ss -lntp | grep :8084",

              "echo ==========================================",
              "echo Checking Spring Boot Health",
              "echo ==========================================",

              "curl -sf http://localhost:8084/actuator/health",

              "echo",

              "echo ==========================================",
              "echo Checking Health Status",
              "echo ==========================================",

              "curl -sf http://localhost:8084/actuator/health | grep -q '\''\"status\":\"UP\"'\''",

              "echo",

              "echo ==========================================",
              "echo BACKEND VERIFICATION SUCCESSFUL",
              "echo =========================================="

            ]' \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo ""
          echo "VERIFICATION COMMAND ID:"
          echo "$COMMAND_ID"


          echo ""
          echo "Waiting for verification..."

          while true
          do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" \
              --output text)

            echo "Verification status: $STATUS"

            case "$STATUS" in

              Pending|InProgress)
                sleep 5
                ;;

              Success)
                echo "Verification successful."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo ""
                echo "=========================================="
                echo "BACKEND VERIFICATION FAILED"
                echo "=========================================="

                echo ""
                echo "STANDARD OUTPUT:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo ""
                echo "STANDARD ERROR:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done


          echo ""
          echo "=========================================="
          echo "FINAL VERIFICATION OUTPUT"
          echo "=========================================="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text


          echo ""
          echo "=========================================="
          echo "BACKEND DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

