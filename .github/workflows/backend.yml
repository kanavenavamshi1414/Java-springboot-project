name: Backend to EC2

on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to Private EC2 using SSM
        shell: bash
        run: |
          set -e

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot Backend" \
            --parameters 'commands=[
              "set -e",

              "echo Installing required packages...",
              "sudo yum install -y git maven java-17-amazon-corretto",

              "echo Preparing application directory...",
              "APP_DIR=/home/ec2-user/app",
              "REPO_NAME=Java-springboot-project",
              "REPO_URL=https://github.com/CloudTechDevOps/Java-springboot-project.git",

              "mkdir -p $APP_DIR",
              "cd $APP_DIR",

              "if [ -d \"$REPO_NAME/.git\" ]; then cd $REPO_NAME && git reset --hard && git pull origin main; else git clone $REPO_URL && cd $REPO_NAME; fi",

              "echo Building application...",
              "cd /home/ec2-user/app/Java-springboot-project/backend",
              "mvn clean package -DskipTests -U",

              "echo Stopping old application...",
              "PID=$(pgrep -f \"datastore-0.0.7.jar\" || true)",
              "if [ -n \"$PID\" ]; then kill -15 $PID || true; sleep 5; fi",

              "PID=$(pgrep -f \"datastore-0.0.7.jar\" || true)",
              "if [ -n \"$PID\" ]; then kill -9 $PID || true; fi",

              "echo Starting application...",
              "LOG_DIR=/var/log/app",
              "sudo mkdir -p $LOG_DIR",
              "sudo chown ec2-user:ec2-user $LOG_DIR",

              "cd /home/ec2-user/app/Java-springboot-project/backend/target",

              "nohup env MYSQL_HOST=\"${{ secrets.DB_HOST }}\" MYSQL_PORT=3306 MYSQL_USERNAME=\"${{ secrets.DB_USERNAME }}\" MYSQL_PASSWORD=\"${{ secrets.DB_PASSWORD }}\" LOG_FILE_PATH=$LOG_DIR/datastore.log java -jar datastore-0.0.7.jar --server.port=8084 --server.address=0.0.0.0 > $LOG_DIR/nohup.out 2>&1 &",

              "echo Waiting for application...",
              "sleep 15",

              "echo Checking application health...",
              "HEALTH=$(curl -s http://localhost:8084/actuator/health)",
              "echo $HEALTH",

              "echo $HEALTH | grep -q '\"status\":\"UP\"'",

              "echo Deployment successful!"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for EC2 command to complete..."

          aws ssm wait command-executed \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "Getting deployment output..."

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text

          echo "Getting deployment errors..."

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' \
            --output text
