name: Frontend to Public EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout Repository
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Deploy Frontend to Public EC2
      # ==================================================
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.FRONTEND_EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            echo "=========================================="
            echo "Starting Frontend Deployment"
            echo "=========================================="

            echo "Checking current user"
            whoami

            echo "Checking Python"
            python3 --version || true

            echo "Checking pip"
            pip3 --version || true


            # ==================================================
            # 3. Prepare Application Directory
            # ==================================================

            echo "=========================================="
            echo "Preparing Application Directory"
            echo "=========================================="

            APP_DIR=/home/ec2-user/front
            REPO_NAME=Java-springboot-project
            REPO_URL=https://github.com/CloudTechDevOps/Java-springboot-project.git

            mkdir -p "$APP_DIR"

            cd "$APP_DIR"


            # ==================================================
            # 4. Clone or Pull Repository
            # ==================================================

            echo "=========================================="
            echo "Updating Repository"
            echo "=========================================="

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists"

              cd "$REPO_NAME"

              git reset --hard
              git clean -fd

              git fetch origin

              git checkout main

              git pull origin main

            else

              echo "Cloning repository"

              git clone "$REPO_URL" "$REPO_NAME"

              cd "$REPO_NAME"

            fi


            # ==================================================
            # 5. Install Python
            # ==================================================

            echo "=========================================="
            echo "Installing Python Dependencies"
            echo "=========================================="

            sudo dnf install -y python3 python3-pip


            # ==================================================
            # 6. Go to Frontend
            # ==================================================

            cd /home/ec2-user/front/Java-springboot-project/frontend

            echo "Frontend directory:"
            pwd

            echo "Frontend files:"
            ls -la


            # ==================================================
            # 7. Create Virtual Environment
            # ==================================================

            echo "=========================================="
            echo "Preparing Python Virtual Environment"
            echo "=========================================="

            if [ ! -d "venv" ]; then

              echo "Creating virtual environment"

              python3 -m venv venv

            else

              echo "Virtual environment already exists"

            fi


            # ==================================================
            # 8. Install Requirements
            # ==================================================

            source venv/bin/activate

            python -m pip install --upgrade pip

            if [ -f requirements.txt ]; then

              pip install -r requirements.txt

            else

              echo "WARNING: requirements.txt not found"

            fi


            # ==================================================
            # 9. Stop Existing Frontend
            # ==================================================

            echo "=========================================="
            echo "Stopping Existing Frontend"
            echo "=========================================="

            sudo systemctl stop frontend.service || true


            # ==================================================
            # 10. Create Systemd Service
            # ==================================================

            echo "=========================================="
            echo "Creating Frontend Systemd Service"
            echo "=========================================="

            sudo tee /etc/systemd/system/frontend.service > /dev/null <<'EOF'

[Unit]
Description=Streamlit Frontend Application
After=network.target

[Service]
Type=simple
User=ec2-user

WorkingDirectory=/home/ec2-user/front/Java-springboot-project/frontend

ExecStart=/home/ec2-user/front/Java-springboot-project/frontend/venv/bin/streamlit run app.py --server.port=8501 --server.address=0.0.0.0

Environment="API_URL=http://${BACKEND_PRIVATE_IP}:8084"

Restart=always
RestartSec=5

StandardOutput=append:/home/ec2-user/frontend.log
StandardError=append:/home/ec2-user/frontend-error.log

[Install]
WantedBy=multi-user.target

EOF


            # ==================================================
            # 11. Replace Backend IP
            # ==================================================

            echo "=========================================="
            echo "Configuring Backend Connection"
            echo "=========================================="

            sudo sed -i \
              "s|\${BACKEND_PRIVATE_IP}|${{ secrets.BACKEND_PRIVATE_IP }}|g" \
              /etc/systemd/system/frontend.service


            # ==================================================
            # 12. Reload Systemd
            # ==================================================

            echo "=========================================="
            echo "Reloading Systemd"
            echo "=========================================="

            sudo systemctl daemon-reload

            sudo systemctl enable frontend.service


            # ==================================================
            # 13. Start Frontend
            # ==================================================

            echo "=========================================="
            echo "Starting Frontend"
            echo "=========================================="

            sudo systemctl restart frontend.service


            # ==================================================
            # 14. Wait for Startup
            # ==================================================

            echo "Waiting for frontend startup..."

            sleep 15


            # ==================================================
            # 15. Check Service
            # ==================================================

            echo "=========================================="
            echo "Frontend Service Status"
            echo "=========================================="

            sudo systemctl status frontend.service --no-pager || true


            # ==================================================
            # 16. Check Port
            # ==================================================

            echo "=========================================="
            echo "Checking Port 8501"
            echo "=========================================="

            sudo ss -lntp | grep :8501


            # ==================================================
            # 17. Check HTTP
            # ==================================================

            echo "=========================================="
            echo "Checking Frontend HTTP Response"
            echo "=========================================="

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              http://localhost:8501)

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then

              echo "Frontend HTTP check failed"

              echo "Frontend logs:"
              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi


            # ==================================================
            # 18. Deployment Successful
            # ==================================================

            echo "=========================================="
            echo "Frontend Deployment Successful"
            echo "=========================================="

            echo "Frontend Port: 8501"

            echo "Backend: ${{ secrets.BACKEND_PRIVATE_IP }}:8084"

            echo "=========================================="


      # ==================================================
      # 19. Final Verification
      # ==================================================
      - name: Verify Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.FRONTEND_EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |

            set -e

            echo "=========================================="
            echo "Final Frontend Verification"
            echo "=========================================="

            echo "Checking systemd service"

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "Frontend service is NOT running"

              sudo systemctl status frontend.service --no-pager || true

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi


            echo "Frontend service is running"


            echo "Checking port 8501"

            sudo ss -lntp | grep :8501


            echo "Checking HTTP"

            curl \
              -L \
              --fail \
              --max-time 10 \
              http://localhost:8501 \
              > /dev/null


            echo "=========================================="
            echo "Frontend Verification Successful"
            echo "=========================================="


      # ==================================================
      # 20. Email Notification
      # ==================================================
      - name: Send Deployment Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          from: ${{ secrets.EMAIL_USERNAME }}
          to: ${{ secrets.EMAIL_TO }}

          subject: Frontend Deployment - ${{ job.status }}

          body: |
            Frontend Deployment Report

            Repository:
            ${{ github.repository }}

            Workflow:
            ${{ github.workflow }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Triggered By:
            ${{ github.actor }}

            Run Number:
            ${{ github.run_number }}

            Status:
            ${{ job.status }}

            Deployment Method:
            SSH

            Frontend EC2:
            ${{ secrets.FRONTEND_EC2_HOST }}

            Frontend Port:
            8501

            Backend Private IP:
            ${{ secrets.BACKEND_PRIVATE_IP }}

            Backend Port:
            8084

            Regards,
            GitHub Actions
