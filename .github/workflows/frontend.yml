```yaml
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |
            echo "=========================================="
            echo "SSH CONNECTION SUCCESS"
            echo "=========================================="

            whoami
            hostname

            echo "OS:"
            cat /etc/os-release | head -5

            echo "Python:"
            python3 --version || true

            echo "Git:"
            git --version || true

            echo "Disk:"
            df -h /

            echo "=========================================="
            echo "SSH TEST COMPLETE"
            echo "=========================================="
```
