
name: Frontend to Public EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # DEPLOY FRONTEND
      # ==================================================

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m

          script: |
            set -e

            echo "=================================================="
            echo "        FRONTEND DEPLOYMENT STARTED"
            echo "=================================================="

            echo "Current user:"
            whoami

            echo "Hostname:"
            hostname


            # ==================================================
            # VARIABLES
            # ==================================================

            APP_DIR="/home/ec2-user/front"
            REPO_NAME="Java-springboot-project"
            REPO_URL="https://github.com/CloudTechDevOps/Java-springboot-project.git"

            FRONTEND_DIR="$APP_DIR/$REPO_NAME/frontend"

            BACKEND_IP="${{ secrets.BACKEND_PRIVATE_IP }}"


            echo "Application directory:"
            echo "$APP_DIR"

            echo "Repository:"
            echo "$REPO_NAME"

            echo "Frontend directory:"
            echo "$FRONTEND_DIR"

            echo "Backend private IP:"
            echo "$BACKEND_IP"


            # ==================================================
            # CHECK BACKEND IP
            # ==================================================

            if [ -z "$BACKEND_IP" ]; then
              echo "ERROR: BACKEND_PRIVATE_IP secret is empty"
              exit 1
            fi


            # ==================================================
            # PREPARE APPLICATION DIRECTORY
            # ==================================================

            echo "=================================================="
            echo "Preparing application directory"
            echo "=================================================="

            mkdir -p "$APP_DIR"

            cd "$APP_DIR"


            # ==================================================
            # CLONE OR UPDATE REPOSITORY
            # ==================================================

            echo "=================================================="
            echo "Updating repository"
            echo "=================================================="

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists"

              cd "$REPO_NAME"

              git fetch origin

              git checkout main

              git reset --hard origin/main

              git clean -fd

            else

              echo "Cloning repository"

              git clone "$REPO_URL" "$REPO_NAME"

              cd "$REPO_NAME"

            fi


            # ==================================================
            # SHOW COMMIT
            # ==================================================

            echo "=================================================="
            echo "Current commit"
            echo "=================================================="

            git rev-parse --short HEAD


            # ==================================================
            # INSTALL PYTHON
            # ==================================================

            echo "=================================================="
            echo "Installing Python"
            echo "=================================================="

            sudo dnf install -y \
              python3 \
              python3-pip \
              python3-devel


            # ==================================================
            # CHECK FRONTEND DIRECTORY
            # ==================================================

            echo "=================================================="
            echo "Checking frontend directory"
            echo "=================================================="

            if [ ! -d "$FRONTEND_DIR" ]; then
              echo "ERROR: Frontend directory not found"
              echo "Expected:"
              echo "$FRONTEND_DIR"
              echo ""
              echo "Repository contents:"
              find "$APP_DIR/$REPO_NAME" -maxdepth 2 -type f | sort
              exit 1
            fi

            cd "$FRONTEND_DIR"

            echo "Frontend files:"
            ls -la


            # ==================================================
            # CHECK APPLICATION FILES
            # ==================================================

            echo "=================================================="
            echo "Checking application files"
            echo "=================================================="

            if [ ! -f "app.py" ]; then
              echo "ERROR: app.py not found"
              exit 1
            fi

            if [ ! -f "requirements.txt" ]; then
              echo "ERROR: requirements.txt not found"
              exit 1
            fi

            echo "app.py found"
            echo "requirements.txt found"


            # ==================================================
            # STOP OLD SERVICE
            # ==================================================

            echo "=================================================="
            echo "Stopping existing frontend service"
            echo "=================================================="

            sudo systemctl stop frontend.service || true


            # ==================================================
            # CREATE PYTHON VIRTUAL ENVIRONMENT
            # ==================================================

            echo "=================================================="
            echo "Preparing Python virtual environment"
            echo "=================================================="

            if [ ! -f "venv/bin/python" ]; then

              echo "Creating new virtual environment"

              rm -rf venv

              python3 -m venv venv

            else

              echo "Existing virtual environment found"

            fi


            # ==================================================
            # FIX OWNERSHIP
            # ==================================================

            echo "=================================================="
            echo "Fixing ownership"
            echo "=================================================="

            sudo chown -R ec2-user:ec2-user "$FRONTEND_DIR"


            # ==================================================
            # INSTALL PYTHON DEPENDENCIES
            # ==================================================

            echo "=================================================="
            echo "Installing Python dependencies"
            echo "=================================================="

            ./venv/bin/python -m pip install --upgrade pip

            ./venv/bin/python -m pip install -r requirements.txt


            # ==================================================
            # VERIFY STREAMLIT
            # ==================================================

            echo "=================================================="
            echo "Checking Streamlit"
            echo "=================================================="

            ./venv/bin/python -m streamlit --version


            # ==================================================
            # TEST STREAMLIT APPLICATION
            # ==================================================

            echo "=================================================="
            echo "Testing Streamlit application"
            echo "=================================================="

            rm -f /tmp/frontend-test.log

            timeout 10 \
              ./venv/bin/python -m streamlit run app.py \
              --server.port=8501 \
              --server.address=127.0.0.1 \
              --server.headless=true \
              > /tmp/frontend-test.log 2>&1 || true

            echo "Streamlit test output:"
            cat /tmp/frontend-test.log || true


            # ==================================================
            # CREATE SYSTEMD SERVICE
            # ==================================================

            echo "=================================================="
            echo "Creating frontend systemd service"
            echo "=================================================="

            sudo tee /etc/systemd/system/frontend.service > /dev/null <<EOF
[Unit]
Description=Streamlit Frontend Application
After=network.target

[Service]
Type=simple
User=ec2-user
Group=ec2-user

WorkingDirectory=$FRONTEND_DIR

ExecStart=$FRONTEND_DIR/venv/bin/python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true

Environment="API_URL=http://$BACKEND_IP:8084"

Restart=always
RestartSec=5

StandardOutput=append:/home/ec2-user/frontend.log
StandardError=append:/home/ec2-user/frontend-error.log

[Install]
WantedBy=multi-user.target
EOF


            # ==================================================
            # SHOW SERVICE CONFIGURATION
            # ==================================================

            echo "=================================================="
            echo "Frontend service configuration"
            echo "=================================================="

            sudo cat /etc/systemd/system/frontend.service


            # ==================================================
            # SYSTEMD RELOAD
            # ==================================================

            echo "=================================================="
            echo "Reloading systemd"
            echo "=================================================="

            sudo systemctl daemon-reload

            sudo systemctl enable frontend.service


            # ==================================================
            # START FRONTEND
            # ==================================================

            echo "=================================================="
            echo "Starting frontend"
            echo "=================================================="

            sudo systemctl restart frontend.service


            # ==================================================
            # WAIT FOR APPLICATION
            # ==================================================

            echo "Waiting for frontend to start..."

            sleep 10


            # ==================================================
            # SERVICE CHECK
            # ==================================================

            echo "=================================================="
            echo "Checking frontend service"
            echo "=================================================="

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "ERROR: Frontend service failed"

              echo ""
              echo "--------------- SYSTEMD STATUS ---------------"

              sudo systemctl status frontend.service \
                --no-pager \
                -l || true

              echo ""
              echo "--------------- JOURNAL ---------------"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              echo ""
              echo "--------------- FRONTEND ERROR LOG ---------------"

              sudo cat /home/ec2-user/frontend-error.log || true

              exit 1

            fi

            echo "Frontend service is running."


            # ==================================================
            # PORT CHECK
            # ==================================================

            echo "=================================================="
            echo "Checking port 8501"
            echo "=================================================="

            if ! sudo ss -lntp | grep -q ":8501"; then

              echo "ERROR: Port 8501 is not listening"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              exit 1

            fi

            echo "Port 8501 is listening."


            # ==================================================
            # LOCAL HTTP CHECK
            # ==================================================

            echo "=================================================="
            echo "Checking HTTP"
            echo "=================================================="

            HTTP_CODE=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 15 \
              http://127.0.0.1:8501/)

            echo "HTTP Status: $HTTP_CODE"


            if [ "$HTTP_CODE" != "200" ]; then

              echo "ERROR: Frontend HTTP check failed"

              echo ""
              echo "--------------- SYSTEMD STATUS ---------------"

              sudo systemctl status frontend.service \
                --no-pager \
                -l || true

              echo ""
              echo "--------------- JOURNAL ---------------"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              echo ""
              echo "--------------- FRONTEND ERROR LOG ---------------"

              sudo cat /home/ec2-user/frontend-error.log || true

              exit 1

            fi

            echo "HTTP check successful."


            # ==================================================
            # DEPLOYMENT SUCCESS
            # ==================================================

            echo "=================================================="
            echo "        FRONTEND DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo "Frontend:"
            echo "http://${{ secrets.EC2_HOST }}:8501"

            echo "Backend private IP:"
            echo "$BACKEND_IP"

            echo "Backend port:"
            echo "8084"

            echo "=================================================="

