
name: Frontend to Public EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout Repository
      # ==================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Deploy Frontend
      # ==================================================
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            echo "=========================================="
            echo "Starting Frontend Deployment"
            echo "=========================================="

            APP_DIR="/home/ec2-user/front"
            REPO_NAME="Java-springboot-project"
            REPO_URL="https://github.com/CloudTechDevOps/Java-springboot-project.git"

            echo "Creating application directory..."

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"


            # ==================================================
            # Clone / Update Repository
            # ==================================================

            echo "=========================================="
            echo "Updating Repository"
            echo "=========================================="

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists"

              cd "$REPO_NAME"

              git reset --hard
              git clean -fd

              git fetch origin
              git checkout main
              git pull origin main

            else

              echo "Cloning repository..."

              git clone "$REPO_URL" "$REPO_NAME"

              cd "$REPO_NAME"

            fi


            # ==================================================
            # Install Python
            # ==================================================

            echo "=========================================="
            echo "Installing Python"
            echo "=========================================="

            sudo dnf install -y python3 python3-pip python3-devel


            # ==================================================
            # Frontend Directory
            # ==================================================

            FRONTEND_DIR="/home/ec2-user/front/Java-springboot-project/frontend"

            if [ ! -d "$FRONTEND_DIR" ]; then

              echo "ERROR: Frontend directory does not exist"

              exit 1

            fi

            cd "$FRONTEND_DIR"

            echo "Frontend directory:"
            pwd

            echo "Frontend files:"
            ls -la


            # ==================================================
            # Python Virtual Environment
            # ==================================================

            echo "=========================================="
            echo "Preparing Python Virtual Environment"
            echo "=========================================="

            if [ ! -d "venv" ]; then

              python3 -m venv venv

            fi

            source venv/bin/activate


            # ==================================================
            # Install Requirements
            # ==================================================

            echo "=========================================="
            echo "Installing Python Dependencies"
            echo "=========================================="

            python -m pip install --upgrade pip

            if [ -f requirements.txt ]; then

              pip install -r requirements.txt

            else

              echo "WARNING: requirements.txt not found"

            fi

            deactivate || true


            # ==================================================
            # Stop Existing Frontend
            # ==================================================

            echo "=========================================="
            echo "Stopping Existing Frontend"
            echo "=========================================="

            sudo systemctl stop frontend.service || true


            # ==================================================
            # Create Systemd Service
            # ==================================================

            echo "=========================================="
            echo "Creating Frontend Systemd Service"
            echo "=========================================="

            sudo tee /etc/systemd/system/frontend.service > /dev/null <<EOF
            [Unit]
            Description=Streamlit Frontend Application
            After=network.target

            [Service]
            Type=simple
            User=ec2-user

            WorkingDirectory=/home/ec2-user/front/Java-springboot-project/frontend

            ExecStart=/home/ec2-user/front/Java-springboot-project/frontend/venv/bin/streamlit run app.py --server.port=8501 --server.address=0.0.0.0

            Environment="API_URL=http://${{ secrets.BACKEND_PRIVATE_IP }}:8084"

            Restart=always
            RestartSec=5

            StandardOutput=append:/home/ec2-user/frontend.log
            StandardError=append:/home/ec2-user/frontend-error.log

            [Install]
            WantedBy=multi-user.target
            EOF


            # ==================================================
            # Show Service Configuration
            # ==================================================

            echo "=========================================="
            echo "Frontend Service Configuration"
            echo "=========================================="

            sudo cat /etc/systemd/system/frontend.service


            # ==================================================
            # Reload Systemd
            # ==================================================

            echo "=========================================="
            echo "Reloading Systemd"
            echo "=========================================="

            sudo systemctl daemon-reload

            sudo systemctl enable frontend.service


            # ==================================================
            # Start Frontend
            # ==================================================

            echo "=========================================="
            echo "Starting Frontend"
            echo "=========================================="

            sudo systemctl restart frontend.service


            # ==================================================
            # Wait
            # ==================================================

            echo "Waiting for frontend..."

            sleep 15


            # ==================================================
            # Check Service
            # ==================================================

            echo "=========================================="
            echo "Checking Frontend Service"
            echo "=========================================="

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "ERROR: Frontend service failed"

              sudo systemctl status frontend.service --no-pager || true

              echo "Frontend logs:"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi

            echo "Frontend service is running"


            # ==================================================
            # Check Port
            # ==================================================

            echo "=========================================="
            echo "Checking Port 8501"
            echo "=========================================="

            if ! sudo ss -lntp | grep -q ':8501'; then

              echo "ERROR: Port 8501 is not listening"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi

            echo "Port 8501 is listening"


            # ==================================================
            # Check Frontend HTTP
            # ==================================================

            echo "=========================================="
            echo "Checking Frontend HTTP"
            echo "=========================================="

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              http://localhost:8501)

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then

              echo "ERROR: Frontend HTTP check failed"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi


            # ==================================================
            # Check Backend Private Connection
            # ==================================================

            echo "=========================================="
            echo "Checking Backend Connection"
            echo "=========================================="

            echo "Backend IP:"
            echo "${{ secrets.BACKEND_PRIVATE_IP }}"

            echo "Backend Port:"
            echo "8084"

            if curl \
              -s \
              --max-time 10 \
              "http://${{ secrets.BACKEND_PRIVATE_IP }}:8084/actuator/health"; then

              echo ""
              echo "Backend is reachable"

            else

              echo ""
              echo "WARNING: Backend is not reachable"

              echo "Check:"
              echo "1. Backend service"
              echo "2. Backend port 8084"
              echo "3. Backend Security Group"
              echo "4. Frontend and Backend VPC connectivity"

            fi


            # ==================================================
            # Deployment Successful
            # ==================================================

            echo "=========================================="
            echo "Frontend Deployment Successful"
            echo "=========================================="

            echo "Frontend Port: 8501"

            echo "Backend:"
            echo "${{ secrets.BACKEND_PRIVATE_IP }}:8084"

            echo "=========================================="


      # ==================================================
      # 3. Final Verification
      # ==================================================
      - name: Verify Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |
            set -e

            echo "=========================================="
            echo "Final Frontend Verification"
            echo "=========================================="


            echo "Checking service..."

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "Frontend service is NOT running"

              sudo systemctl status frontend.service --no-pager || true

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100

              exit 1

            fi

            echo "Frontend service is running"


            echo "=========================================="
            echo "Checking Port 8501"
            echo "=========================================="

            sudo ss -lntp | grep ':8501'


            echo "=========================================="
            echo "Checking HTTP"
            echo "=========================================="

            curl \
              -L \
              --fail \
              --max-time 10 \
              http://localhost:8501 \
              > /dev/null

            echo "Frontend HTTP check successful"


            echo "=========================================="
            echo "Verification Successful"
            echo "=========================================="


      # ==================================================
      # 4. Email Notification
      # ==================================================
      - name: Send Deployment Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          from: ${{ secrets.EMAIL_USERNAME }}
          to: ${{ secrets.EMAIL_TO }}

          subject: Frontend Deployment - ${{ job.status }}

          body: |
            Frontend Deployment Report

            Repository:
            ${{ github.repository }}

            Workflow:
            ${{ github.workflow }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Triggered By:
            ${{ github.actor }}

            Run Number:
            ${{ github.run_number }}

            Status:
            ${{ job.status }}

            Deployment Method:
            SSH

            Frontend EC2:
            ${{ secrets.EC2_HOST }}

            Frontend Port:
            8501

            Backend Private IP:
            ${{ secrets.BACKEND_PRIVATE_IP }}

            Backend Port:
            8084

            Regards,
            GitHub Actions

