
name: Frontend to Public EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Deploy Frontend
      # ==================================================

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            echo "=================================================="
            echo "        FRONTEND DEPLOYMENT STARTED"
            echo "=================================================="

            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            APP_DIR="/home/ec2-user/front"
            REPO_NAME="Java-springboot-project"
            REPO_URL="https://github.com/CloudTechDevOps/Java-springboot-project.git"

            FRONTEND_DIR="$APP_DIR/$REPO_NAME/frontend"

            BACKEND_IP="${{ secrets.BACKEND_PRIVATE_IP }}"

            echo "Frontend directory:"
            echo "$FRONTEND_DIR"

            echo "Backend private IP:"
            echo "$BACKEND_IP"

            if [ -z "$BACKEND_IP" ]; then
              echo "ERROR: BACKEND_PRIVATE_IP secret is empty"
              exit 1
            fi


            # ==================================================
            # 3. Application Directory
            # ==================================================

            echo "=================================================="
            echo "Preparing application directory"
            echo "=================================================="

            mkdir -p "$APP_DIR"

            cd "$APP_DIR"


            # ==================================================
            # 4. Clone / Update Repository
            # ==================================================

            echo "=================================================="
            echo "Updating repository"
            echo "=================================================="

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists"

              cd "$REPO_NAME"

              git fetch origin
              git checkout main
              git reset --hard origin/main
              git clean -fd

            else

              echo "Cloning repository"

              git clone "$REPO_URL" "$REPO_NAME"

              cd "$REPO_NAME"

            fi

            echo "Current commit:"
            git rev-parse --short HEAD


            # ==================================================
            # 5. Install Python
            # ==================================================

            echo "=================================================="
            echo "Installing Python"
            echo "=================================================="

            sudo dnf install -y python3 python3-pip python3-devel


            # ==================================================
            # 6. Frontend Directory
            # ==================================================

            if [ ! -d "$FRONTEND_DIR" ]; then

              echo "ERROR: Frontend directory not found"

              exit 1

            fi

            cd "$FRONTEND_DIR"

            echo "Frontend files:"
            ls -la


            # ==================================================
            # 7. Check Required Files
            # ==================================================

            if [ ! -f "app.py" ]; then

              echo "ERROR: app.py not found"

              exit 1

            fi

            if [ ! -f "requirements.txt" ]; then

              echo "ERROR: requirements.txt not found"

              exit 1

            fi


            # ==================================================
            # 8. Stop Existing Service
            # ==================================================

            echo "=================================================="
            echo "Stopping existing frontend"
            echo "=================================================="

            sudo systemctl stop frontend.service || true


            # ==================================================
            # 9. Create Virtual Environment
            # ==================================================

            echo "=================================================="
            echo "Preparing Python virtual environment"
            echo "=================================================="

            if [ ! -x "venv/bin/python" ]; then

              echo "Creating venv"

              rm -rf venv

              python3 -m venv venv

            fi


            # ==================================================
            # 10. Fix Ownership
            # ==================================================

            echo "Fixing ownership"

            sudo chown -R ec2-user:ec2-user "$APP_DIR"


            # ==================================================
            # 11. Install Dependencies
            # ==================================================

            echo "=================================================="
            echo "Installing Python dependencies"
            echo "=================================================="

            ./venv/bin/python -m pip install --upgrade pip

            ./venv/bin/python -m pip install -r requirements.txt


            # ==================================================
            # 12. Verify Streamlit
            # ==================================================

            echo "=================================================="
            echo "Checking Streamlit"
            echo "=================================================="

            ./venv/bin/python -m streamlit --version

            if [ ! -x "./venv/bin/streamlit" ]; then

              echo "ERROR: Streamlit executable not found"

              ls -la ./venv/bin/

              exit 1

            fi


            # ==================================================
            # 13. Fix Ownership Again
            # ==================================================

            sudo chown -R ec2-user:ec2-user "$FRONTEND_DIR"


            # ==================================================
            # 14. Create Systemd Service
            # ==================================================

            echo "=================================================="
            echo "Creating systemd service"
            echo "=================================================="

            sudo tee /etc/systemd/system/frontend.service > /dev/null <<EOF
[Unit]
Description=Streamlit Frontend Application
After=network.target

[Service]
Type=simple
User=ec2-user
Group=ec2-user

WorkingDirectory=$FRONTEND_DIR

ExecStart=$FRONTEND_DIR/venv/bin/python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true

Environment="API_URL=http://$BACKEND_IP:8084"

Restart=always
RestartSec=5

StandardOutput=append:/home/ec2-user/frontend.log
StandardError=append:/home/ec2-user/frontend-error.log

[Install]
WantedBy=multi-user.target
EOF


            # ==================================================
            # 15. Show Service
            # ==================================================

            echo "=================================================="
            echo "Systemd configuration"
            echo "=================================================="

            sudo cat /etc/systemd/system/frontend.service


            # ==================================================
            # 16. Reload Systemd
            # ==================================================

            sudo systemctl daemon-reload

            sudo systemctl enable frontend.service


            # ==================================================
            # 17. Start Frontend
            # ==================================================

            echo "=================================================="
            echo "Starting frontend"
            echo "=================================================="

            sudo systemctl restart frontend.service


            # ==================================================
            # 18. Wait
            # ==================================================

            sleep 15


            # ==================================================
            # 19. Check Service
            # ==================================================

            echo "=================================================="
            echo "Checking frontend service"
            echo "=================================================="

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "ERROR: Frontend service failed"

              sudo systemctl status frontend.service --no-pager || true

              echo "---------------- JOURNAL ----------------"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              echo "---------------- ERROR LOG ----------------"

              sudo cat /home/ec2-user/frontend-error.log || true

              exit 1

            fi

            echo "Frontend service is running."


            # ==================================================
            # 20. Check Port
            # ==================================================

            echo "=================================================="
            echo "Checking port 8501"
            echo "=================================================="

            if ! sudo ss -lntp | grep ':8501'; then

              echo "ERROR: Port 8501 is not listening"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              exit 1

            fi


            # ==================================================
            # 21. HTTP Health Check
            # ==================================================

            echo "=================================================="
            echo "Checking HTTP"
            echo "=================================================="

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 15 \
              http://127.0.0.1:8501)

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then

              echo "ERROR: Frontend HTTP check failed"

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              exit 1

            fi


            # ==================================================
            # 22. Success
            # ==================================================

            echo "=================================================="
            echo "        FRONTEND DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo "Frontend Port: 8501"

            echo "Backend Private IP: $BACKEND_IP"

            echo "Backend Port: 8084"

            echo "=================================================="


      # ==================================================
      # 23. Final Verification
      # ==================================================

      - name: Verify Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m

          script: |
            set -e

            echo "=================================================="
            echo "        FINAL FRONTEND VERIFICATION"
            echo "=================================================="


            echo "Checking service..."

            if ! sudo systemctl is-active --quiet frontend.service; then

              echo "Frontend service is NOT running"

              sudo systemctl status frontend.service --no-pager || true

              sudo journalctl \
                -u frontend.service \
                --no-pager \
                -n 100 || true

              exit 1

            fi


            echo "Frontend service is running."


            echo "Checking port 8501..."

            sudo ss -lntp | grep ':8501'


            echo "Checking HTTP..."

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 15 \
              http://127.0.0.1:8501)

            echo "HTTP Status: $HTTP_CODE"


            if [ "$HTTP_CODE" != "200" ]; then

              echo "Frontend HTTP check failed"

              exit 1

            fi


            echo "=================================================="
            echo "        FRONTEND VERIFICATION SUCCESSFUL"
            echo "=================================================="


      # ==================================================
      # 24. Email Notification
      # ==================================================

      - name: Send Deployment Report
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          to: ${{ secrets.EMAIL_TO }}
          subject: Frontend Deployment - ${{ job.status }}

          body: |
            Frontend Deployment Report

            Repository:
            ${{ github.repository }}

            Workflow:
            ${{ github.workflow }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Triggered By:
            ${{ github.actor }}

            Run Number:
            ${{ github.run_number }}

            Status:
            ${{ job.status }}

            Deployment Method:
            SSH

            Frontend EC2:
            ${{ secrets.EC2_HOST }}

            Frontend Port:
            8501

            Backend Private IP:
            ${{ secrets.BACKEND_PRIVATE_IP }}

            Backend Port:
            8084

            Regards,
            GitHub Actions

