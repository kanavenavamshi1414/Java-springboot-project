
name: Frontend to Public EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Frontend
        run: |
          echo "Checking frontend..."
          test -f frontend/app.py
          test -f frontend/requirements.txt
          echo "Frontend files found."
          ls -la frontend

      - name: Copy Frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "frontend"
          target: "/home/ec2-user/front"
          overwrite: true
          timeout: 60s

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m

          script: |
            set -e

            echo "=========================================="
            echo "FRONTEND DEPLOYMENT STARTED"
            echo "=========================================="

            FRONTEND_DIR="/home/ec2-user/front/frontend"
            BACKEND_IP="${{ secrets.BACKEND_PRIVATE_IP }}"

            echo "Frontend: $FRONTEND_DIR"
            echo "Backend: $BACKEND_IP:8084"

            if [ -z "$BACKEND_IP" ]; then
              echo "ERROR: BACKEND_PRIVATE_IP is empty"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/app.py" ]; then
              echo "ERROR: app.py not found"
              ls -la "$FRONTEND_DIR"
              exit 1
            fi

            if [ ! -f "$FRONTEND_DIR/requirements.txt" ]; then
              echo "ERROR: requirements.txt not found"
              exit 1
            fi

            echo "Frontend files verified."

            sudo dnf install -y python3 python3-pip python3-devel

            sudo chown -R ec2-user:ec2-user "$FRONTEND_DIR"

            if [ ! -f "$FRONTEND_DIR/venv/bin/python" ]; then
              rm -rf "$FRONTEND_DIR/venv"
              python3 -m venv "$FRONTEND_DIR/venv"
            fi

            "$FRONTEND_DIR/venv/bin/python" -m pip install --upgrade pip

            "$FRONTEND_DIR/venv/bin/python" -m pip install -r "$FRONTEND_DIR/requirements.txt"

            "$FRONTEND_DIR/venv/bin/python" -m streamlit --version

            sudo systemctl stop frontend.service || true

            sudo rm -f /etc/systemd/system/frontend.service

            sudo bash -c "printf '%s\n' \
            '[Unit]' \
            'Description=Streamlit Frontend Application' \
            'After=network.target' \
            '' \
            '[Service]' \
            'Type=simple' \
            'User=ec2-user' \
            'Group=ec2-user' \
            'WorkingDirectory=$FRONTEND_DIR' \
            'ExecStart=$FRONTEND_DIR/venv/bin/python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true' \
            'Environment=API_URL=http://$BACKEND_IP:8084' \
            'Restart=always' \
            'RestartSec=5' \
            '' \
            '[Install]' \
            'WantedBy=multi-user.target' \
            > /etc/systemd/system/frontend.service"

            sudo systemctl daemon-reload

            sudo systemctl enable frontend.service

            sudo systemctl restart frontend.service

            echo "Waiting for Streamlit..."

            sleep 10

            if ! sudo systemctl is-active --quiet frontend.service; then
              echo "ERROR: frontend.service failed"

              sudo systemctl status frontend.service --no-pager -l || true

              sudo journalctl -u frontend.service --no-pager -n 100 || true

              exit 1
            fi

            echo "Frontend service is running."

            if ! sudo ss -lntp | grep -q ":8501"; then
              echo "ERROR: Port 8501 is not listening"

              sudo journalctl -u frontend.service --no-pager -n 100 || true

              exit 1
            fi

            echo "Port 8501 is listening."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://127.0.0.1:8501/)

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Streamlit HTTP check failed"

              sudo systemctl status frontend.service --no-pager -l || true

              sudo journalctl -u frontend.service --no-pager -n 100 || true

              exit 1
            fi

            echo "=========================================="
            echo "FRONTEND DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo "Frontend URL:"
            echo "http://${{ secrets.EC2_HOST }}:8501"

            echo "Backend:"
            echo "http://$BACKEND_IP:8084"

            echo "=========================================="

